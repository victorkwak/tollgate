[package]
name = "tollgate"
version = "0.3.0"
edition = "2024"
# std `File::lock`/`try_lock` (R85) need 1.89.
rust-version = "1.89"
description = "Gates the git ref updates of Claude Code sessions on checks run against the exact tree"
license = "Apache-2.0"
repository = "https://github.com/victorkwak/tollgate"
homepage = "https://github.com/victorkwak/tollgate"
readme = "README.md"
build = "build.rs"
keywords = ["claude-code", "git", "hooks", "agents", "ci"]
categories = ["command-line-utilities", "development-tools"]

# One package, two targets: the library holds every module so integration
# tests can drive them; `src/main.rs` is a thin shell over it (spec section 5).
[lib]
path = "src/lib.rs"

[[bin]]
name = "tollgate"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
globset = { version = "=0.4.21", default-features = false }
jiff = { version = "=0.2.39", features = ["serde"] }
libc = "=0.2.191"
quick-xml = "=0.42.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
thiserror = "=2.0.21"
toml = "=1.2.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
# R23: a panic must unwind to `catch_unwind` in main and exit 2, never abort.
panic = "unwind"
